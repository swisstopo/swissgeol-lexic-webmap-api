  /vocabularies/chronostratigraphy/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Chronostratigraphy vocabulary
      responses:
        "200":
          description: List of layers with filters on Chronostratigraphy vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: tecto_units_augm
                    name: Tectonic Units
                  - id: gc_bedrock
                    name: GC_BEDROCK
                  - id: gc_unco_deposits
