openapi: 3.0.3
info:
  title: SwissTopo WebMap Semantic Filter API
  description: |
    RESTful API to discover filterable layers, list enabled semantic filters and their parameters, and to obtain a customized WMS endpoint (with semantic query) to display a filtered layer on a map.
    All endpoints are protected by API Key authentication.
    Clients must provide a valid API key using the `X-API-Key` HTTP header.

    OpenAPI JSON endpoint available at <base-url>/swagger/json
  version: 1.6.0
externalDocs:
  description: WebMap semantic filter architecture and usage
  url: https://virtserver.swaggerhub.com/epsilonitalia/SwissTopoWebmapAPI/1.0.1
servers:
  - url: https://webmap-api.swissgeol.ch
    description: Swisstopo Production Server
  - url: https://int-webmap-api.swissgeol.ch
    description: Swisstopo INT Server
  - url: https://dev-webmap-api.swissgeol.ch
    description: Swisstopo DEV Server
security:
- ApiKeyAuth: []
tags:
- name: Layers
  description: Endpoints to list layers and their filters
- name: Vocabularies
  description: Endpoints for listing vocabularies and their terms
- name: WMS
  description: Endpoints to obtain WMS links for filtered layers

paths:
  /layers:
    get:
      tags:
      - Layers
      summary: Get list of filterable layers for a WebMap
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for filter labels and descriptions
      responses:
        "200":
          description: List of filterable layers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
              example:
                webmapId: SwissTopoMap
                layers:
                  - id: tecto_units_augm
                    name: Tectonic Units
                    filterable: true
                    availableFilters:
                      - id: f-chronostrat-term
                        name: Filter by Chronostratigraphy term
                        title: Filter by Chronostratigraphy term
                        description: Filter by chronostratigraphic intervals
                      - id: f-tectonic-term
                        name: Filter by Tectonic Units term
                        title: Filter by Tectonic Units term
                        description: Filter by tectonic units
                      - id: f-byAttribute
                        name: Filter by Attribute
                        title: Filter by Attribute
                        description: Filter by attribute key/value
                  - id: gc_bedrock
                    name: GC_BEDROCK
                    filterable: true
                    availableFilters:
                      - id: f-chronostrat-term
                        name: Filter by Chronostratigraphy term
                        title: Filter by Chronostratigraphy term
                        description: Filter by chronostratigraphic intervals
                      - id: f-tectonic-term
                        name: Filter by Tectonic Units term
                        title: Filter by Tectonic Units term
                        description: Filter by tectonic units
                      - id: f-lithostrat-term
                        name: Filter by Lithostratigraphy term
                        title: Filter by Lithostratigraphy term
                        description: Filter by lithostratigraphic units
                      - id: f-lithology-term
                        name: Filter by Lithology term
                        title: Filter by Lithology term
                        description: Filter by lithology classes
                      - id: f-byAttribute
                        name: Filter by Attribute
                        title: Filter by Attribute
                        description: Filter by attribute key/value
                  - id: gc_unco_deposits
                    name: GC_UNCO_DEPOSITS
                    filterable: true
                    availableFilters:
                      - id: f-chronostrat-term
                        name: Filter by Chronostratigraphy term
                        title: Filter by Chronostratigraphy term
                        description: Filter by chronostratigraphic intervals
                      - id: f-byAttribute
                        name: Filter by Attribute
                        title: Filter by Attribute
                        description: Filter by attribute key/value
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /layers/{layerId}/filters:
    get:
      tags:
      - Layers
      summary: Get enabled filters for a specific layer
      parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for filter labels and descriptions
      responses:
        "200":
          description: Enabled filters for the specified layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_1"
              examples:
                gc_bedrock:
                  summary: Filters for gc_bedrock layer
                  value:
                    layerId: gc_bedrock
                    filters:
                      - id: f-chronostrat-term
                        name: Filter by Chronostratigraphy term
                        title: Filter by Chronostratigraphy term
                        description: Filter by chronostratigraphic intervals
                      - id: f-tectonic-term
                        name: Filter by Tectonic Units term
                        title: Filter by Tectonic Units term
                        description: Filter by tectonic units
                      - id: f-lithostrat-term
                        name: Filter by Lithostratigraphy term
                        title: Filter by Lithostratigraphy term
                        description: Filter by lithostratigraphic units
                      - id: f-lithology-term
                        name: Filter by Lithology term
                        title: Filter by Lithology term
                        description: Filter by lithology classes
                      - id: f-byAttribute
                        name: Filter by Attribute
                        title: Filter by Attribute
                        description: Filter by attribute key/value
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /layers/{layerId}/defaultFilters:
    get:
      tags:
      - Layers
      summary: Get default filters for a layer and a vocabulary term
      description: >
        Returns the default filters that should be applied to visualize the provided vocabulary term on the selected layer.
        The vocabulary is inferred from the term URI. If the layer does not support the inferred vocabulary, the endpoint returns an error.
      parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
      - name: term
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: Vocabulary term URI used to infer the vocabulary and build the default filter
      responses:
        "200":
          description: Default filters for the specified layer and term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultFiltersResponse"
              examples:
                ChronostratigraphyTerm:
                  summary: Example with a Chronostratigraphy term and no default filters
                  value:
                    layerId: gc_bedrock
                    filters: []
                LithologyTerm:
                  summary: Example with a Lithology term and one default filter
                  value:
                    layerId: gc_bedrock
                    filters:
                      - filterId: f-lithology-term
                        parameters:
                          term: https://dev-lexic.swissgeol.ch/Lithology/Amphibolite
                          includeNarrowers: true
                TectonicUnitsTerm:
                  summary: Example with a Tectonic Units term and one default filter
                  value:
                    layerId: tecto_units_augm
                    filters:
                      - filterId: f-tectonic-term
                        parameters:
                          term: https://dev-lexic.swissgeol.ch/TectonicUnits/UpperRhineGraben
                          includeNarrowers: true
        "400":
          description: The layer does not support the vocabulary inferred from the provided term URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 400
                message: Layer does not support the vocabulary inferred from the provided term
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /layers/{layerId}/attributeList:
    get:
      tags:
      - Layers
      summary: Get available attributes for filter by attribute on a specific layer
      parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Attribute list for the specified layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_2"
              examples:
                gc_bedrock:
                  summary: Attributes for gc_bedrock layer
                  value:
                    layerId: gc_bedrock
                    attributes:
                      - uuid
                      - fmat_litstrat
                      - objectid
                      - kind
                      - rbed_orig_descr
                      - form_att
                      - fmat_litstrat_code
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /vocabularies:
    get:
      tags:
      - Vocabularies
      summary: Get the list of available vocabularies
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for vocabulary labels
      responses:
        "200":
          description: List of vocabularies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabulariesList"
              example:
                vocabularies:
                  - id: chronostratigraphy
                    name: Chronostratigraphy
                  - id: tectonic-units
                    name: Tectonic Units
                  - id: lithostratigraphy
                    name: Lithostratigraphy
                  - id: lithology
                    name: Lithology
  /vocabularies/chronostratigraphy/terms:
