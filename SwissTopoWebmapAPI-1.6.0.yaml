  /generateWmsRequest:
    post:
      tags:
      - WMS
      summary: Generate a WMS Base URL for a filtered layer (semantic query applied)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WmsRequest"
            example:
              webmapId: SwissTopoMap
              layerId: tecto_units_augm
              filters:
                - filterId: f-tectonic-term
                  parameters:
                    term: https://dev-lexic.swissgeol.ch/TectonicUnits/AutochthonousNorthAlpineForeland
                    includeNarrowers: true
        required: true
      responses:
        "200":
          description: WMS endpoint with filtered layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsResponse"
              example:
                url: https://dev-webmap-api.swissgeol.ch/wms
                body: 'REQUEST=GetMap&SERVICE=WMS&VERSION=1.3.0&FORMAT=image/png&STYLES=swisstopo:filtered&TRANSPARENT=true&LAYERS=tecto_units_augm&TILED=true&SEMANTIC_FILTER="tecto_lexic" IN ( get_terms( "North Alpine Foreland" , True ) )&CRS=EPSG:2056'
                mimeType: image/png
                note: The WMS URL includes encoded semantic query parameters.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /wms:
    get:
      tags:
      - WMS
      summary: Retrieve WMS service information
      description: This endpoint returns information about the WMS service or available maps depending on the specified parameters.
      responses:
        "200":
          description: Successful WMS response
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - WMS
      summary: Retrieve WMS service information
      description: This endpoint returns information about the WMS service or available maps depending on the specified parameters.
      responses:
        "200":
          description: Successful WMS response
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Layer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        filterable:
          type: boolean
        availableFilters:
          type: array
          items:
            $ref: "#/components/schemas/Layer_availableFilters"

    Filter:
      type: object
      properties:
        id:
          type: string
          enum:
            - f-chronostrat-term
            - f-tectonic-term
            - f-lithostrat-term
            - f-lithology-term
            - f-byAttribute
        name:
          type: string
        title:
          type: string
        description:
          type: string

    # Schemi per i parametri dei filtri (hard-coded)
    ChronostratigraphyFilterParameter:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [Younger, From-To, Older]
        from:
          type: string
          description: "From term (required if type is From-To or Older)"
        to:
          type: string
          description: "To term (required if type is From-To or Younger)"

    TermFilterParameter:
      type: object
      required: [term]
      properties:
        term:
          type: string
          description: "Selected term from vocabulary"
        includeNarrowers:
          type: boolean
          description: "Whether to include narrower terms"
          default: true

    ByAttributeFilterParameter:
      type: object
      required: [attribute, value]
      properties:
        attribute:
          type: string
          description: "Attribute key available from /layers/{layerId}/attributeList"
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          description: "Attribute value to match"

    WmsRequest:
      required:
      - webmapId
      - layerId
      type: object
      properties:
        webmapId:
          type: string
        layerId:
          type: string
        filters:
          type: array
          description: List of applied filters and their parameter values
          items:
            $ref: "#/components/schemas/WmsRequest_filters"
    WmsRequest_filters:
      type: object
      properties:
        filterId:
          type: string
          enum:
            - f-chronostrat-term
            - f-tectonic-term
            - f-lithostrat-term
            - f-lithology-term
            - f-byAttribute
        parameters:
          oneOf:
            - $ref: "#/components/schemas/ChronostratigraphyFilterParameter"
            - $ref: "#/components/schemas/TermFilterParameter"
            - $ref: "#/components/schemas/ByAttributeFilterParameter"

    WmsResponse:
      type: object
      required:
        - url
        - body
        - mimeType
        - note
      properties:
        url:
          type: string
          format: uri
          description: WMS endpoint URL to call.
          example: https://dev-webmap-api.swissgeol.ch/wms
        body:
          type: string
          description: WMS request parameter string generated by /generateWmsRequest.
          example: 'REQUEST=GetMap&SERVICE=WMS&VERSION=1.3.0&FORMAT=image/png&STYLES=swisstopo:filtered&TRANSPARENT=true&LAYERS=tecto_units_augm&TILED=true&SEMANTIC_FILTER="tecto_lexic" IN ( get_terms( "North Alpine Foreland" , True ) )&CRS=EPSG:2056'
        mimeType:
          type: string
          example: image/png
        note:
          type: string
          example: WMS URL includes encoded semantic query parameters.

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    inline_response_200:
      type: object
      properties:
        webmapId:
          type: string
        layers:
          type: array
          items:
            $ref: "#/components/schemas/Layer"

    inline_response_200_1:
      type: object
      properties:
        layerId:
          type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"

    inline_response_200_2:
      type: object
      properties:
        layerId:
          type: string
        attributes:
          type: array
          items:
            type: string

    Layer_availableFilters:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string

    DefaultFiltersResponse:
      type: object
      required: [layerId, filters]
      properties:
        layerId:
          type: string
        filters:
          type: array
          description: Default filters to apply when visualizing the selected vocabulary term on the map
          items:
            $ref: "#/components/schemas/WmsRequest_filters"

    VocabulariesList:
      type: object
      properties:
        vocabularies:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyDescriptor"

    VocabularyDescriptor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    VocabularyTerms:
      type: object
      properties:
        terms:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyTerm"

    VocabularyTerm:
      type: object
      properties:
        term:
          type: string
          format: uri
        label:
          type: string
        description:
          type: string
        breadcrumbs:
          description: Ordered breadcrumb map. Keys represent numeric positions and are serialized as strings in JSON, for example "0", "1", "2".
          type: object
          additionalProperties:
            type: string

    VocabularyLayerRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    VocabularyLayersResponse:
      type: object
      properties:
        layers:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyLayerRef"

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 500
            message: Internal server error

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
      description: >
        API key required to access all endpoints of the SwissTopo WebMap Semantic Filtering API.
