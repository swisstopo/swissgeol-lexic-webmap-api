openapi: 3.0.3
info:
  title: SwissTopo WebMap Semantic Filter API
  description: |
    RESTful API to discover filterable layers, list enabled semantic filters and their parameters, and to obtain a customized WMS endpoint (with semantic query) to display a filtered layer on a map.
    All endpoints are protected by API Key authentication.
    Clients must provide a valid API key using the `X-API-Key` HTTP header.
  version: 1.3.0
externalDocs:
  description: WebMap semantic filter architecture and usage
  url: https://virtserver.swaggerhub.com/epsilonitalia/SwissTopoWebmapAPI/1.0.1
servers:
- url: https://virtserver.swaggerhub.com/epsilonitalia/SwissTopoWebmapAPI/1.0.1
  description: SwaggerHub API Auto Mocking
- url: https://api.example.com/v1
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Layers
  description: Endpoints to list layers and their filters
- name: WMS
  description: Endpoints to obtain WMS links for filtered layers
- name: Vocabularies
  description: Endpoints for listing vocabularies and their terms

paths:
  /layers:
    get:
      tags:
      - Layers
      summary: Get list of filterable layers for a WebMap
      responses:
        "200":
          description: List of filterable layers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
              example:
                webmapId: SwissTopoMap
                layers:
                - id: TECTONIC_UNITS
                  name: Tectonic Units
                  filterable: true
                  availableFilters:
                  - id: f-chronostrat-term
                    name: Filter by Chronostratigraphy term
                  - id: f-tectonic-term
                    name: Filter by Tectonic Units term
                - id: GC_BEDROCK
                  name: Bedrock Geology
                  filterable: true
                  availableFilters:
                  - id: f-chronostrat-term
                    name: Filter by Chronostratigraphy term
                  - id: f-tectonic-term
                    name: Filter by Tectonic Units term
                  - id: f-lithostrat-term
                    name: Filter by Lithostratigraphy term
                  - id: f-lithology-term
                    name: Filter by Lithology term
                  - id: f-byAttribute
                    name: Filter by Attribute
                - id: GC_UNCO_DEPOSITS
                  name: Unconsolidated Deposits
                  filterable: true
                  availableFilters:
                  - id: f-chronostrat-term
                    name: Filter by Chronostratigraphy term
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /layers/{layerId}/filters:
    get:
      tags:
      - Layers
      summary: Get enabled filters for a specific layer
      parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Enabled filters for the specified layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_1"
              examples:
                GC_BEDROCK:
                  summary: Filters for GC_BEDROCK layer
                  value:
                    layerId: GC_BEDROCK
                    filters:
                    - id: f-chronostrat-term
                      name: Filter by Chronostratigraphy term
                      description: Filter by chronostratigraphic intervals
                    - id: f-tectonic-term
                      name: Filter by Tectonic Units term
                      description: Filter by tectonic units
                    - id: f-lithostrat-term
                      name: Filter by Lithostratigraphy term
                      description: Filter by lithostratigraphic units
                    - id: f-lithology-term
                      name: Filter by Lithology term
                      description: Filter by lithology classes
                    - id: f-byAttribute
                      name: Filter by Attribute
                      description: Filter by attribute key/value
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /layers/{layerId}/attributeList:
    get:
      tags:
      - Layers
      summary: Get available attributes for filter by attribute on a specific layer
      parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Attribute list for the specified layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_2"
              examples:
                GC_BEDROCK:
                  summary: Attributes for GC_BEDROCK layer
                  value:
                    layerId: GC_BEDROCK
                    attributes:
                      - uuid
                      - objectid
                      - kind
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /vocabularies:
    get:
      tags:
      - Vocabularies
      summary: Get the list of available vocabularies
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for vocabulary labels
      responses:
        "200":
          description: List of vocabularies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabulariesList"
              example:
                vocabularies:
                  - id: chronostratigraphy
                    name: Chronostratigraphy
                  - id: tectonic-units
                    name: Tectonic Units
                  - id: lithostratigraphy
                    name: Lithostratigraphy
                  - id: lithology
                    name: Lithology

  /vocabularies/chronostratigraphy/terms:
    get:
      tags:
      - Vocabularies
      summary: Get all Chronostratigraphy terms
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for vocabulary labels
      responses:
        "200":
          description: List of Chronostratigraphy terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyTerms'
              example:
                terms:
                  - https://lexic.swissgeol.ch/Quaternary
                  - https://lexic.swissgeol.ch/Neogene
                  - https://lexic.swissgeol.ch/Paleogene
                  - https://lexic.swissgeol.ch/Cretaceous
                  - https://lexic.swissgeol.ch/Jurassic
                  - https://lexic.swissgeol.ch/Triassic
                  - https://lexic.swissgeol.ch/Permian

  /vocabularies/tectonic-units/terms:
    get:
      tags:
      - Vocabularies
      summary: Get all Tectonic Units terms
      responses:
        "200":
          description: List of Tectonic Units terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyTerms'
              example:
                terms:
                  - https://lexic.swissgeol.ch/Helvetic
                  - https://lexic.swissgeol.ch/Penninic
                  - https://lexic.swissgeol.ch/Salassic
                  - https://lexic.swissgeol.ch/LechtalNappe
                  - https://lexic.swissgeol.ch/InntalNappe

  /vocabularies/lithostratigraphy/terms:
    get:
      tags:
      - Vocabularies
      summary: Get all Lithostratigraphy terms
      responses:
        "200":
          description: List of Lithostratigraphy terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyTerms'
              example:
                terms:
                  - https://lexic.swissgeol.ch/Molasse
                  - https://lexic.swissgeol.ch/Adriaticplate
                  - https://lexic.swissgeol.ch/Caraleschist
                  - https://lexic.swissgeol.ch/Haupterbreccia
                  - https://lexic.swissgeol.ch/Servino

  /vocabularies/lithology/terms:
    get:
      tags:
      - Vocabularies
      summary: Get all Lithology terms
      responses:
        "200":
          description: List of Lithology terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyTerms'
              example:
                terms:
                  - https://lexic.swissgeol.ch/Rock
                  - https://lexic.swissgeol.ch/RockSedimentary
                  - https://lexic.swissgeol.ch/Breccia
                  - https://lexic.swissgeol.ch/Marlstone
                  - https://lexic.swissgeol.ch/Dolostone

  /vocabularies/chronostratigraphy/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Chronostratigraphy vocabulary
      responses:
        "200":
          description: List of layers with filters on Chronostratigraphy vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: tecto_units_augm
                    name: Tectonic Units
                  - id: gc_bedrock
                    name: GC_BEDROCK
                  - id: gc_unco_deposits
                    name: GC_UNCO_DEPOSITS

  /vocabularies/tectonic-units/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Tectonic Units vocabulary
      responses:
        "200":
          description: List of layers with filters on Tectonic Units vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: tecto_units_augm
                    name: Tectonic Units
                  - id: gc_bedrock
                    name: GC_BEDROCK

  /vocabularies/lithostratigraphy/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Lithostratigraphy vocabulary
      responses:
        "200":
          description: List of layers with filters on Lithostratigraphy vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: gc_bedrock
                    name: GC_BEDROCK

  /vocabularies/lithology/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Lithology vocabulary
      responses:
        "200":
          description: List of layers with filters on Lithology vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: gc_bedrock
                    name: GC_BEDROCK

  /wms:
    post:
      tags:
      - WMS
      summary: Generate a WMS Base URL for a filtered layer (semantic query applied)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WmsRequest"
            example:
              webmapId: SwissTopoMap
              layerId: GC_BEDROCK
              filters:
              - filterId: f-chronostrat-term
                parameters:
                  type: From-To
                  from: Jurassic
                  to: Cretaceous
              - filterId: f-lithology-term
                parameters:
                  term: limestone
                  includeNarrowers: true
        required: true
      responses:
        "200":
          description: WMS endpoint with filtered layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsResponse"
              example:
                url: "https://wms.example.com/geoserver/wms?service=WMS&version=1.3.0&request=GetMap&layers=GC_BEDROCK&crs=EPSG:3857&bbox=700000,100000,800000,200000&width=256&height=256&format=image/png&transparent=true&CQL_FILTER=f-chronostrat-term( From-To , Jurassic , Cretaceous ) AND f-lithology-term( limestone , true )"
                mimeType: image/png
                note: The WMS URL includes encoded semantic query parameters.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    Layer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        filterable:
          type: boolean
        availableFilters:
          type: array
          items:
            $ref: "#/components/schemas/Layer_availableFilters"

    Filter:
      type: object
      properties:
        id:
          type: string
          enum:
            - f-chronostrat-term
            - f-tectonic-term
            - f-lithostrat-term
            - f-lithology-term
            - f-byAttribute
        name:
          type: string
        description:
          type: string

    # Schemi per i parametri dei filtri (hard-coded)
    ChronostratigraphyFilterParameter:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [Younger, From-To, Older]
        from:
          type: string
          description: "From term (required if type is From-To or Older)"
        to:
          type: string
          description: "To term (required if type is From-To or Younger)"

    TermFilterParameter:
      type: object
      required: [term]
      properties:
        term:
          type: string
          description: "Selected term from vocabulary"
        includeNarrowers:
          type: boolean
          description: "Whether to include narrower terms"
          default: true

    ByAttributeFilterParameter:
      type: object
      required: [attribute, value]
      properties:
        attribute:
          type: string
          description: "Attribute key available from /layers/{layerId}/attributeList"
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          description: "Attribute value to match"

    WmsRequest:
      required:
      - webmapId
      - layerId
      type: object
      properties:
        webmapId:
          type: string
        layerId:
          type: string
        filters:
          type: array
          description: List of applied filters and their parameter values
          items:
            $ref: "#/components/schemas/WmsRequest_filters"
    WmsRequest_filters:
      type: object
      properties:
        filterId:
          type: string
          enum:
            - f-chronostrat-term
            - f-tectonic-term
            - f-lithostrat-term
            - f-lithology-term
            - f-byAttribute
        parameters:
          oneOf:
            - $ref: "#/components/schemas/ChronostratigraphyFilterParameter"
            - $ref: "#/components/schemas/TermFilterParameter"
            - $ref: "#/components/schemas/ByAttributeFilterParameter"

    WmsResponse:
      type: object
      properties:
        url:
          type: string
          description: Fully formed WMS GetMap URL for filtered layer
        mimeType:
          type: string
          example: image/png
        note:
          type: string
          example: WMS URL includes encoded semantic query parameters.

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    inline_response_200:
      type: object
      properties:
        webmapId:
          type: string
        layers:
          type: array
          items:
            $ref: "#/components/schemas/Layer"

    inline_response_200_1:
      type: object
      properties:
        layerId:
          type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"

    inline_response_200_2:
      type: object
      properties:
        layerId:
          type: string
        attributes:
          type: array
          items:
            type: string

    Layer_availableFilters:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    VocabulariesList:
      type: object
      properties:
        vocabularies:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyDescriptor"

    VocabularyDescriptor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    VocabularyTerms:
      type: object
      properties:
        terms:
          type: array
          items:
            type: string

    VocabularyLayerRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    VocabularyLayersResponse:
      type: object
      properties:
        layers:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyLayerRef"

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
      description: >
        API key required to access all endpoints of the SwissTopo WebMap Semantic Filtering API.

