openapi: 3.0.3
info:
  title: SwissTopo WebMap Semantic Filter API
  description: |
    RESTful API to discover filterable layers, list enabled semantic filters and their parameters, and to obtain a customized WMS endpoint (with semantic query) to display a filtered layer on a map.
    All endpoints are protected by API Key authentication.
    Clients must provide a valid API key using the `X-API-Key` HTTP header.

    OpenAPI JSON endpoint available at <base-url>/swagger/json
  version: 1.5.0
externalDocs:
  description: WebMap semantic filter architecture and usage
  url: https://virtserver.swaggerhub.com/epsilonitalia/SwissTopoWebmapAPI/1.0.1
servers:
  - url: https://webmap-api.swissgeol.ch
    description: Swisstopo Production Server
  - url: https://int-webmap-api.swissgeol.ch
    description: Swisstopo INT Server
  - url: https://dev-webmap-api.swissgeol.ch
    description: Swisstopo DEV Server
security:
- ApiKeyAuth: []
tags:
- name: Layers
  description: Endpoints to list layers and their filters
- name: Vocabularies
  description: Endpoints for listing vocabularies and their terms
- name: WMS
  description: Endpoints to obtain WMS links for filtered layers

paths:
  /layers:
    get:
      tags:
      - Layers
      summary: Get list of filterable layers for a WebMap
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for filter labels and descriptions
      responses:
        "200":
          description: List of filterable layers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
              example:
                webmapId: SwissTopoMap
                layers:
                - id: TECTONIC_UNITS
                  name: Tectonic Units
                  filterable: true
                  availableFilters:
                  - id: f-chronostrat-term
                    name: Filter by Chronostratigraphy term
                    title: Filter by Chronostratigraphy term
                    description: Filter by chronostratigraphic intervals
                  - id: f-tectonic-term
                    name: Filter by Tectonic Units term
                    title: Filter by Tectonic Units term
                    description: Filter by tectonic units
                - id: GC_BEDROCK
                  name: Bedrock Geology
                  filterable: true
                  availableFilters:
                  - id: f-chronostrat-term
                    name: Filter by Chronostratigraphy term
                    title: Filter by Chronostratigraphy term
                    description: Filter by chronostratigraphic intervals
                  - id: f-tectonic-term
                    name: Filter by Tectonic Units term
                    title: Filter by Tectonic Units term
                    description: Filter by tectonic units
                  - id: f-lithostrat-term
                    name: Filter by Lithostratigraphy term
                    title: Filter by Lithostratigraphy term
                    description: Filter by lithostratigraphic units
                  - id: f-lithology-term
                    name: Filter by Lithology term
                    title: Filter by Lithology term
                    description: Filter by lithology classes
                  - id: f-byAttribute
                    name: Filter by Attribute
                    title: Filter by Attribute
                    description: Filter by attribute key/value
                - id: GC_UNCO_DEPOSITS
                  name: Unconsolidated Deposits
                  filterable: true
                  availableFilters:
                  - id: f-chronostrat-term
                    name: Filter by Chronostratigraphy term
                    title: Filter by Chronostratigraphy term
                    description: Filter by chronostratigraphic intervals
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /layers/{layerId}/filters:
    get:
      tags:
      - Layers
      summary: Get enabled filters for a specific layer
      parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for filter labels and descriptions
      responses:
        "200":
          description: Enabled filters for the specified layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_1"
              examples:
                GC_BEDROCK:
                  summary: Filters for GC_BEDROCK layer
                  value:
                    layerId: GC_BEDROCK
                    filters:
                    - id: f-chronostrat-term
                      name: Filter by Chronostratigraphy term
                      title: Filter by Chronostratigraphy term
                      description: Filter by chronostratigraphic intervals
                    - id: f-tectonic-term
                      name: Filter by Tectonic Units term
                      title: Filter by Tectonic Units term
                      description: Filter by tectonic units
                    - id: f-lithostrat-term
                      name: Filter by Lithostratigraphy term
                      title: Filter by Lithostratigraphy term
                      description: Filter by lithostratigraphic units
                    - id: f-lithology-term
                      name: Filter by Lithology term
                      title: Filter by Lithology term
                      description: Filter by lithology classes
                    - id: f-byAttribute
                      name: Filter by Attribute
                      title: Filter by Attribute
                      description: Filter by attribute key/value
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /layers/{layerId}/defaultFilters:
    get:
      tags:
      - Layers
      summary: Get default filters for a layer and a vocabulary term
      description: >
        Returns the default filters that should be applied to visualize the provided vocabulary term on the selected layer.
        The vocabulary is inferred from the term URI. If the layer does not support the inferred vocabulary, the endpoint returns an error.
      parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
      - name: term
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: Vocabulary term URI used to infer the vocabulary and build the default filter
      responses:
        "200":
          description: Default filters for the specified layer and term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultFiltersResponse"
              examples:
                ChronostratigraphyTerm:
                  summary: Example with a Chronostratigraphy term and no default filters
                  value:
                    layerId: GC_BEDROCK
                    filters: []
                LithologyTerm:
                  summary: Example with a Lithology term and one default filter
                  value:
                    layerId: GC_BEDROCK
                    filters:
                    - filterId: f-lithology-term
                      parameters:
                        term: https://dev-lexic.swissgeol.ch/Lithology/Amphibolite
                        includeNarrowers: true
                TectonicUnitsTerm:
                  summary: Example with a Tectonic Units term and one default filter
                  value:
                    layerId: TECTONIC_UNITS
                    filters:
                    - filterId: f-tectonic-term
                      parameters:
                        term: https://dev-lexic.swissgeol.ch/TectonicUnits/UpperRhineGraben
                        includeNarrowers: true
        "400":
          description: The layer does not support the vocabulary inferred from the provided term URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 400
                message: Layer does not support the vocabulary inferred from the provided term
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /layers/{layerId}/attributeList:
    get:
      tags:
      - Layers
      summary: Get available attributes for filter by attribute on a specific layer
      parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Attribute list for the specified layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_2"
              examples:
                GC_BEDROCK:
                  summary: Attributes for GC_BEDROCK layer
                  value:
                    layerId: GC_BEDROCK
                    attributes:
                      - uuid
                      - objectid
                      - kind
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /vocabularies:
    get:
      tags:
      - Vocabularies
      summary: Get the list of available vocabularies
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for vocabulary labels
      responses:
        "200":
          description: List of vocabularies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabulariesList"
              example:
                vocabularies:
                  - id: chronostratigraphy
                    name: Chronostratigraphy
                  - id: tectonic-units
                    name: Tectonic Units
                  - id: lithostratigraphy
                    name: Lithostratigraphy
                  - id: lithology
                    name: Lithology

  /vocabularies/chronostratigraphy/terms:
    get:
      tags:
      - Vocabularies
      summary: Get all Chronostratigraphy terms
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for vocabulary related data
      responses:
        "200":
          description: List of Chronostratigraphy terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyTerms'
              example:
                terms:
                  - term: https://lexic.swissgeol.ch/Quaternary
                    label: Quaternary
                    description: Mock description for the Quaternary chronostratigraphy term.
                    breadcrumbs:
                      "0": Home
                      "1": Chronostratigraphy
                      "2": Quaternary
                  - term: https://lexic.swissgeol.ch/Neogene
                    label: Neogene
                    description: Mock description for the Neogene chronostratigraphy term.
                    breadcrumbs:
                      "0": Home
                      "1": Chronostratigraphy
                      "2": Neogene

  /vocabularies/tectonic-units/terms:
    get:
      tags:
      - Vocabularies
      summary: Get all Tectonic Units terms
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for vocabulary related data
      responses:
        "200":
          description: List of Tectonic Units terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyTerms'
              example:
                terms:
                  - term: https://lexic.swissgeol.ch/Helvetic
                    label: Helvetic
                    description: Mock description for the Helvetic tectonic units term.
                    breadcrumbs:
                      "0": Home
                      "1": Tectonic Units
                      "2": Helvetic
                  - term: https://lexic.swissgeol.ch/Penninic
                    label: Penninic
                    description: Mock description for the Penninic tectonic units term.
                    breadcrumbs:
                      "0": Home
                      "1": Tectonic Units
                      "2": Penninic

  /vocabularies/lithostratigraphy/terms:
    get:
      tags:
      - Vocabularies
      summary: Get all Lithostratigraphy terms
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for vocabulary related data
      responses:
        "200":
          description: List of Lithostratigraphy terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyTerms'
              example:
                terms:
                  - term: https://lexic.swissgeol.ch/Molasse
                    label: Molasse
                    description: Mock description for the Molasse lithostratigraphy term.
                    breadcrumbs:
                      "0": Home
                      "1": Lithostratigraphy
                      "2": Molasse
                  - term: https://lexic.swissgeol.ch/Servino
                    label: Servino
                    description: Mock description for the Servino lithostratigraphy term.
                    breadcrumbs:
                      "0": Home
                      "1": Lithostratigraphy
                      "2": Servino

  /vocabularies/lithology/terms:
    get:
      tags:
      - Vocabularies
      summary: Get all Lithology terms
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, it, de, fr]
          default: en
        description: Language for vocabulary related data
      responses:
        "200":
          description: List of Lithology terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyTerms'
              example:
                terms:
                  - term: https://lexic.swissgeol.ch/Rock
                    label: Rock
                    description: Mock description for the Rock lithology term.
                    breadcrumbs:
                      "0": Home
                      "1": Lithology
                      "2": Rock
                  - term: https://lexic.swissgeol.ch/Breccia
                    label: Breccia
                    description: Mock description for the Breccia lithology term.
                    breadcrumbs:
                      "0": Home
                      "1": Lithology
                      "2": Breccia

  /vocabularies/chronostratigraphy/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Chronostratigraphy vocabulary
      responses:
        "200":
          description: List of layers with filters on Chronostratigraphy vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: tecto_units_augm
                    name: Tectonic Units
                  - id: gc_bedrock
                    name: GC_BEDROCK
                  - id: gc_unco_deposits
                    name: GC_UNCO_DEPOSITS

  /vocabularies/tectonic-units/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Tectonic Units vocabulary
      responses:
        "200":
          description: List of layers with filters on Tectonic Units vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: tecto_units_augm
                    name: Tectonic Units
                  - id: gc_bedrock
                    name: GC_BEDROCK

  /vocabularies/lithostratigraphy/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Lithostratigraphy vocabulary
      responses:
        "200":
          description: List of layers with filters on Lithostratigraphy vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: gc_bedrock
                    name: GC_BEDROCK

  /vocabularies/lithology/layers:
    get:
      tags:
      - Vocabularies
      summary: Get layers filterable by Lithology vocabulary
      responses:
        "200":
          description: List of layers with filters on Lithology vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyLayersResponse'
              example:
                layers:
                  - id: gc_bedrock
                    name: GC_BEDROCK

  /wms:
    post:
      tags:
      - WMS
      summary: Generate a WMS Base URL for a filtered layer (semantic query applied)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WmsRequest"
            example:
              webmapId: SwissTopoMap
              layerId: GC_BEDROCK
              filters:
              - filterId: f-chronostrat-term
                parameters:
                  type: From-To
                  from: Jurassic
                  to: Cretaceous
              - filterId: f-lithology-term
                parameters:
                  term: limestone
                  includeNarrowers: true
        required: true
      responses:
        "200":
          description: WMS endpoint with filtered layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsResponse"
              example:
                url: "https://wms.example.com/geoserver/wms?service=WMS&version=1.3.0&request=GetMap&layers=GC_BEDROCK&crs=EPSG:3857&bbox=700000,100000,800000,200000&width=256&height=256&format=image/png&transparent=true&CQL_FILTER=f-chronostrat-term( From-To , Jurassic , Cretaceous ) AND f-lithology-term( limestone , true )"
                mimeType: image/png
                note: The WMS URL includes encoded semantic query parameters.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    Layer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        filterable:
          type: boolean
        availableFilters:
          type: array
          items:
            $ref: "#/components/schemas/Layer_availableFilters"

    Filter:
      type: object
      properties:
        id:
          type: string
          enum:
            - f-chronostrat-term
            - f-tectonic-term
            - f-lithostrat-term
            - f-lithology-term
            - f-byAttribute
        name:
          type: string
        title:
          type: string
        description:
          type: string

    # Schemi per i parametri dei filtri (hard-coded)
    ChronostratigraphyFilterParameter:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [Younger, From-To, Older]
        from:
          type: string
          description: "From term (required if type is From-To or Older)"
        to:
          type: string
          description: "To term (required if type is From-To or Younger)"

    TermFilterParameter:
      type: object
      required: [term]
      properties:
        term:
          type: string
          description: "Selected term from vocabulary"
        includeNarrowers:
          type: boolean
          description: "Whether to include narrower terms"
          default: true

    ByAttributeFilterParameter:
      type: object
      required: [attribute, value]
      properties:
        attribute:
          type: string
          description: "Attribute key available from /layers/{layerId}/attributeList"
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          description: "Attribute value to match"

    WmsRequest:
      required:
      - webmapId
      - layerId
      type: object
      properties:
        webmapId:
          type: string
        layerId:
          type: string
        filters:
          type: array
          description: List of applied filters and their parameter values
          items:
            $ref: "#/components/schemas/WmsRequest_filters"
    WmsRequest_filters:
      type: object
      properties:
        filterId:
          type: string
          enum:
            - f-chronostrat-term
            - f-tectonic-term
            - f-lithostrat-term
            - f-lithology-term
            - f-byAttribute
        parameters:
          oneOf:
            - $ref: "#/components/schemas/ChronostratigraphyFilterParameter"
            - $ref: "#/components/schemas/TermFilterParameter"
            - $ref: "#/components/schemas/ByAttributeFilterParameter"

    WmsResponse:
      type: object
      properties:
        url:
          type: string
          description: Fully formed WMS GetMap URL for filtered layer
        mimeType:
          type: string
          example: image/png
        note:
          type: string
          example: WMS URL includes encoded semantic query parameters.

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    inline_response_200:
      type: object
      properties:
        webmapId:
          type: string
        layers:
          type: array
          items:
            $ref: "#/components/schemas/Layer"

    inline_response_200_1:
      type: object
      properties:
        layerId:
          type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"

    inline_response_200_2:
      type: object
      properties:
        layerId:
          type: string
        attributes:
          type: array
          items:
            type: string

    Layer_availableFilters:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string

    DefaultFiltersResponse:
      type: object
      required: [layerId, filters]
      properties:
        layerId:
          type: string
        filters:
          type: array
          description: Default filters to apply when visualizing the selected vocabulary term on the map
          items:
            $ref: "#/components/schemas/WmsRequest_filters"

    VocabulariesList:
      type: object
      properties:
        vocabularies:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyDescriptor"

    VocabularyDescriptor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    VocabularyTerms:
      type: object
      properties:
        terms:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyTerm"

    VocabularyTerm:
      type: object
      properties:
        term:
          type: string
          format: uri
        label:
          type: string
        description:
          type: string
        breadcrumbs:
          description: Ordered breadcrumb map. Keys represent numeric positions and are serialized as strings in JSON, for example "0", "1", "2".
          type: object
          additionalProperties:
            type: string

    VocabularyLayerRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    VocabularyLayersResponse:
      type: object
      properties:
        layers:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyLayerRef"

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
      description: >
        API key required to access all endpoints of the SwissTopo WebMap Semantic Filtering API.
